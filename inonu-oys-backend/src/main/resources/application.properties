spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SecretPassword44}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}

file.upload-dir=${FILE_UPLOAD_DIR:../uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

app.jwt.secret=${JWT_SECRET:development-only-secret-change-this-before-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:10000000146}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
